<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo-tr.png">
    <script src="srcipt.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dancing+Script:wght@400..700&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Luckiest+Guy&family=My+Soul&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

</head>

<body>

    <div class="main">

        <div class="header">
            <div class="logo">
                <a href="#">
                    <img width="50px" height="50px" src="img/logo-tr.png" class="logo-img">
                    <h1 class="logo-text">Coffee</h1>
                </a>
            </div>
            <div class="menu-list">
                <ul>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">MEMBERSHIP</a></li>
                    <li><a href="#">EVENTS</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>
            </div>
            <div class="menu-btns">
                <button class="signup-btn" type="button">Sign Up</button>
                <ion-icon class="menu-btn" name="menu-outline"></ion-icon>
            </div>
        </div>

        <div class="menu-overlay"></div>
        <div class="menu-list-small">
            <ion-icon class="close-btn" name="close-outline"></ion-icon>
            <div class="menu-list-overlay"></div>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">MEMBERSHIP</a></li>
                <li><a href="#">EVENTS</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </div>


        <div class="mian-content">
            <section class="content">

                <div class="content-items">
                    <h5 data-aos="fade-right" data-aos-duration="1400">#Coffee for hot days</h5>
                    <h1 data-aos="zoom-in-left" data-aos-duration="1400" data-aos-delay="200">- Cold Brew</h1>
                    <p data-aos="fade-right" data-aos-duration="1400" data-aos-delay="300">Boost your productivity and
                        build your mood with a cup of coffee in the morning.Coffee has a
                        stimulating effect.</p>

                    <div data-aos="flip-down" data-aos-duration="1400" data-aos-delay="350" class="content-links">
                        <button class="cont-btn" type="button">Order Now</button>
                        <a class="cont-link" href="#">
                            $10.00 | <span>Regular price</span>
                        </a>
                    </div>
                </div>

                <div data-aos="zoom-in" data-aos-duration="1400" class="content-img">
                    <img width="105%" src="img/cup-tr.png" alt="Coffee Cup">
                </div>

            </section>

            <div class="icons">
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="700" href="#"><ion-icon
                        name="logo-youtube"></ion-icon></a>
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="800" href="#"><ion-icon
                        name="logo-facebook"></ion-icon></a>
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="900" href="#"><ion-icon
                        name="logo-instagram"></ion-icon></a>
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="1000" href="#"><ion-icon
                        name="logo-twitter"></ion-icon></a>
            </div>
            <div class="icons-small">
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="500" href="#"><ion-icon
                        name="logo-youtube"></ion-icon></a>
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="600" href="#"><ion-icon
                        name="logo-facebook"></ion-icon></a>
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="700" href="#"><ion-icon
                        name="logo-instagram"></ion-icon></a>
                <a data-aos="fade-in" data-aos-duration="1500" data-aos-delay="800" href="#"><ion-icon
                        name="logo-twitter"></ion-icon></a>
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
